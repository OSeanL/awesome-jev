<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
  <title id="title">Jev showcase flow</title>
  <desc id="description">Animated demo scenes connect to a central Jev decision core.</desc>
  <style>
    * { vector-effect: non-scaling-stroke; }
    .line { fill: none; stroke: #202124; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .guide { fill: none; stroke: #b8b8b2; stroke-width: 1; stroke-dasharray: 4 7; }
    .panel { fill: #fff; stroke: #202124; stroke-width: 2; }
    .soft { fill: #d9d9d5; }
    .ink { fill: #202124; }
    .blue { fill: #3157ff; }
    .port { fill: #fff; stroke: #202124; stroke-width: 2; }
    .signal { fill: #3157ff; }
    .core { transform-box: fill-box; transform-origin: center; animation: core 2.8s ease-in-out infinite; }
    .play { transform-box: fill-box; transform-origin: center; animation: play 2.4s ease-in-out infinite; }
    .meter { transform-box: fill-box; transform-origin: left center; animation: meter 3.4s ease-in-out infinite; }
    .meter-b { animation-delay: -1.1s; }
    .slider-a { animation: slider-a 3.6s ease-in-out infinite; }
    .slider-b { animation: slider-b 3.6s ease-in-out -1.2s infinite; }
    .slider-c { animation: slider-c 3.6s ease-in-out -2.4s infinite; }
    .orbit { transform-origin: 380px 250px; animation: orbit 26s linear infinite; }
    @keyframes core { 0%, 100% { transform: scale(.86); opacity: .78; } 50% { transform: scale(1); opacity: 1; } }
    @keyframes play { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.08); } }
    @keyframes meter { 0%, 100% { transform: scaleX(.52); } 50% { transform: scaleX(1); } }
    @keyframes slider-a { 0%, 100% { transform: translateY(-18px); } 50% { transform: translateY(18px); } }
    @keyframes slider-b { 0%, 100% { transform: translateY(15px); } 50% { transform: translateY(-15px); } }
    @keyframes slider-c { 0%, 100% { transform: translateY(-10px); } 50% { transform: translateY(10px); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .core, .play, .meter, .slider-a, .slider-b, .slider-c, .orbit { animation: none; }
      .signal { display: none; }
    }
  </style>
  <defs>
    <path id="route-a" d="M184 98H236V214H314" />
    <path id="route-b" d="M576 98H524V214H446" />
    <path id="route-c" d="M184 402H236V286H314" />
    <path id="route-d" d="M576 402H524V286H446" />
  </defs>

  <g aria-hidden="true">
    <circle class="guide orbit" cx="380" cy="250" r="116" />
    <path class="guide" d="M380 24V112M380 388V476" />
    <circle class="ink" cx="380" cy="24" r="3" />
    <circle class="ink" cx="380" cy="476" r="3" />

    <use href="#route-a" class="line" />
    <use href="#route-b" class="line" />
    <use href="#route-c" class="line" />
    <use href="#route-d" class="line" />

    <g>
      <rect class="panel" x="24" y="48" width="160" height="100" rx="2" />
      <rect class="soft" x="50" y="104" width="20" height="22" />
      <rect class="soft" x="80" y="88" width="20" height="38" />
      <rect class="ink" x="110" y="70" width="20" height="56" />
      <rect class="blue meter" x="140" y="58" width="20" height="68" />
      <circle class="port" cx="184" cy="98" r="8" />
    </g>

    <g>
      <rect class="panel" x="576" y="48" width="160" height="100" rx="2" />
      <path class="line" d="M600 98H712" />
      <circle class="soft" cx="608" cy="98" r="11" />
      <rect class="blue" x="631" y="87" width="22" height="22" rx="2" />
      <path class="soft" d="M676 84 690 98 676 112 662 98Z" />
      <circle class="ink" cx="712" cy="98" r="11" />
      <circle class="port" cx="576" cy="98" r="8" />
    </g>

    <g>
      <rect class="panel" x="24" y="352" width="160" height="100" rx="2" />
      <rect class="soft" x="46" y="376" width="64" height="52" />
      <path class="blue play" d="M72 389 72 415 94 402Z" />
      <rect class="soft" x="124" y="380" width="38" height="8" rx="4" />
      <rect class="soft" x="124" y="398" width="38" height="8" rx="4" />
      <rect class="ink" x="124" y="416" width="28" height="8" rx="4" />
      <circle class="port" cx="184" cy="402" r="8" />
    </g>

    <g>
      <rect class="panel" x="576" y="352" width="160" height="100" rx="2" />
      <path class="soft" d="M614 374V430M656 374V430M698 374V430" stroke="#d9d9d5" stroke-width="6" stroke-linecap="round" />
      <circle class="ink slider-a" cx="614" cy="402" r="9" />
      <circle class="blue slider-b" cx="656" cy="402" r="9" />
      <circle class="ink slider-c" cx="698" cy="402" r="9" />
      <circle class="port" cx="576" cy="402" r="8" />
    </g>

    <g>
      <path class="panel" d="M380 170 460 250 380 330 300 250Z" />
      <path fill="#f8f8f7" stroke="#202124" stroke-width="1.5" d="M380 195 435 250 380 305 325 250Z" />
      <path class="blue core" d="M380 226 404 250 380 274 356 250Z" />
      <circle class="ink" cx="314" cy="214" r="5" />
      <circle class="ink" cx="446" cy="214" r="5" />
      <circle class="ink" cx="314" cy="286" r="5" />
      <circle class="ink" cx="446" cy="286" r="5" />
    </g>

    <circle class="signal" r="4"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#route-a" /></animateMotion></circle>
    <circle class="signal" r="4"><animateMotion dur="3.6s" begin="-.9s" repeatCount="indefinite"><mpath href="#route-b" /></animateMotion></circle>
    <circle class="signal" r="4"><animateMotion dur="4s" begin="-1.8s" repeatCount="indefinite"><mpath href="#route-c" /></animateMotion></circle>
    <circle class="signal" r="4"><animateMotion dur="3.7s" begin="-2.6s" repeatCount="indefinite"><mpath href="#route-d" /></animateMotion></circle>
  </g>
</svg>
